[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-mcp-bug"
version = "1.0.0"
description = "Real-time weather query MCP server based "
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bug Team", email = "13065801223@163.com"}
]
requires-python = ">=3.10"
dependencies = [
    "hello-agents>=0.2.2",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/13065801223/weather-mcp-bug"
Repository = "https://github.com/13065801223/weather-mcp-bug"
"Bug Tracker" = "https://github.com/13065801223/weather-mcp-bug/issues"

[tool.setuptools]
py-modules = ["server"]

